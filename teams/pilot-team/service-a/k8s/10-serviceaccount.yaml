---
# service-a's SA. The ECR module's Pod Identity association for
# pilot-team is bound to the `default` SA in that namespace, so any pod
# (using any SA) in the namespace can pull from ECR. We still create a
# dedicated SA so future RBAC / OIDC / IRSA bindings can target this
# service explicitly without affecting other workloads that may land
# in the same namespace later.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: service-a
  namespace: pilot-team
  labels:
    app.kubernetes.io/name: service-a
    app.kubernetes.io/component: workload
    app.kubernetes.io/part-of: pilot-team-platform-validation
