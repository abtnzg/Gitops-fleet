---
# service-a: minimal validation workload.
# - distroless final image (no shell, runs as UID 65532 — `runAsNonRoot`
#   is enforced by the platform's pod-security baseline).
# - image tag pinned to `dev`. ECR's IMMUTABLE tag policy means we can't
#   accidentally push the same tag twice; the build pipeline bumps
#   to a new tag (e.g. `dev-20260605-153012`) per push.
# - No imagePullSecrets — relies on Pod Identity to mint an ECR token
#   at admission time.
# - Resource requests/limits are floor numbers; let the team tune.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a
  namespace: pilot-team
  labels:
    app.kubernetes.io/name: service-a
    app.kubernetes.io/component: workload
    app.kubernetes.io/part-of: pilot-team-platform-validation
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: service-a
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: service-a
        app.kubernetes.io/component: workload
        app.kubernetes.io/part-of: pilot-team-platform-validation
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: service-a
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: service-a
          image: 851725313390.dkr.ecr.us-east-1.amazonaws.com/apps/service-a:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: LOG_LEVEL
              value: info
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
              ephemeral-storage: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
