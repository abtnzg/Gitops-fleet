{{- if .Values.gateway.enabled }}
---
# ============================================================================
# HTTPRoute: <service> (team-owned)
# ----------------------------------------------------------------------------
# Rendered only when .Values.gateway.enabled=true. Attaches to the
# platform-shared Gateway declared under gateway-system/platform-gateway.
# The ReferenceGrant that authorizes the cross-namespace attachment
# lives in the platform repo and is the platform team's job to create
# (so they can audit which teams are attached to the shared gateway).
#
# Per-team configuration:
#   gateway.hostname: optional hostname filter; leave empty to use
#     the gateway's bare LB address.
#   gateway.pathPrefix: where the route mounts under the gateway.
#     Default "/" catches everything.
#   gateway.backend.port: Service port to target. Defaults to 80.
# ============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "service-a.fullname" . }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "service-a.labels" . | nindent 4 }}
    app.kubernetes.io/component: route
spec:
  parentRefs:
    - name: {{ .Values.gateway.gatewayName }}
      namespace: {{ .Values.gateway.gatewayNamespace }}
      sectionName: {{ .Values.gateway.listenerName | default "http" }}
  {{- with .Values.gateway.hostname }}
  hostnames:
    - {{ . | quote }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.gateway.pathPrefix | default "/" | quote }}
      backendRefs:
        - name: {{ include "service-a.fullname" . }}
          port: {{ .Values.gateway.backend.port | default 80 }}
{{- end }}
